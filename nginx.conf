events{}
http {

    server {
        listen 80;
        server_name smartcontainer.com;

        location / {
                root /usr/share/nginx/html;
                try_files $uri $uri/ =404; 
    
    }
    }

    


    server {
        listen 443 ssl;
        server_name smartcontainer.com;

        ssl_certificate /etc/nginx/certs/nginx.crt;
        ssl_certificate_key /etc/nginx/certs/nginx.key;

    

        location / {
            root /usr/share/nginx/html; 
            try_files $uri $uri/ =404;
        }
    
}
}
