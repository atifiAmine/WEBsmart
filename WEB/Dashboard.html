<!DOCTYPE html>
<html lang="fr">


<head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./style.css" />
    <script src="signin.js" defer></script>
    <title>Smart Containers</title>
    <script src="Dashboard.js" defer></script>
    <!-- Je relie mon fichier Dashboard.html à la bibliothèque justgage pour afficher des jauges-->
    <script src="justgage/justgage.js"></script>
    <script src="justgage/raphael-2.1.4.min.js"></script>

  
  
</head>

<body>
    <div id="overlay"></div>
    <nav class="header-menu">
    <img src="deroulant.png" alt="deroulant" onclick="ouvrir_deroulant()">
    <h1> Mon Espace </h1>
</nav>

<div class="menu_deroulant" id="recuperer_deroulant">
    <a class="a1" href="#">
    <img src="dashboard.png" alt="dashboard" >
    <p>Dashboard</p>
    </a>

    <a class="a2" href="signin.html">
    <img src="deconnexion.png" alt="deconnexion" >
    <p>Se déconnecter</p>
    </a>
</div>

<div class="parent_dashboard">

<div class="titre">
    <h1> Consommation totale </h1>
</div>




<div class="main-menu">

    <!-- Ici, cette div correspondra à la jauge papier. La construction de la jauge est dans le fichier Dashboard.js-->
    <div  class="papier">
        <div id ="message_alert_papier">  </div>
        <div class="jauge_papier" id="papier_jauge"></div>
    <img src="poubelle_papier.png" alt="poubelle_papier"  >
    <h2> Papier </h2>  
    <div id="precision_papier" class="precision"> </div>
    </div>

    


<!-- Ici, cette div correspondra à la jauge verre -->
    
        <div class="verre">
        <div id ="message_alert_verre">  </div>
        <div class="jauge_verre" id="verre_jauge">
            <div  class="survol"></div>
        </div>
    <img src="poubelle_verre.png" alt="poubelle_verre" >
    <h2> Verre </h2>
    <div id="precision_verre" class="precision"> </div>
    </div>

<!-- Ici, cette div correspondra à la jauge plastique -->
    <div  class="plastique">
        <div id ="message_alert_plastique">  </div>
        <div class="jauge_plastique" id="plastique_jauge"></div>
    <img src="poubelle_plastique.png" alt="poubelle_plastique" >
    <h2> Plastique </h2>
    <div id="precision_plastique" class="precision"> </div>
    </div>
</div>


<div class="consommation_personelle">
    <h1> Consommation personelle</h1>
    <table>
        <tr style="background-color : #D2DBBF;text-align:center" ></style>
            <td> Container </td>
            <td> Date de dernière entrée au local </td>
            <td> Usage (m³)</td>
        </tr>

        <tr style="text-align:center">
    
            <td> <img src="poubelle_papier.png" alt="poubelle_papier" style="width : 20%; margin-top : 20px;width:33px;"></td>
            <td id="horaire_papier"> </td>
            <td id="volume_papier"> </td>
        </tr>

       <tr style="text-align:center">
        <td><img src="poubelle_verre.png" alt="poubelle_verre" style="margin-top: 20px;width:33px"></td>
        <td id="horaire_glass"></td>
        <td id="volume_glass"></td>
      </tr> 

      <tr style="text-align:center">
        <td><img src="poubelle_plastique.png" alt="poubelle_plastique" style="margin-top: 20px;width:33px"></td>
        <td id="horaire_plastique" ></td>
        <td id="volume_plastique"></td>
      </tr> 

    </table>
</div>
</div>
    
    </body>
    </html>
