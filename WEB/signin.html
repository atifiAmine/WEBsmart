<!DOCTYPE html>
<html lang="fr">


<head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./style.css" />
    <script src="signin.js" defer></script>
    <title>Smart Containers</title>
</head>

<body>
    <div id="overlay"></div>
    <div class="parent">

        <!-- section Bienvenue dans votre site qui correspond a la section en violet  -->
        <section class="section_bienvenue_site">

            <h2> Bienvenue dans votre site !</h2>
            <div class="logo">
                <img src="logo_site.png" alt="Smart Containers" />
            </div>
            <p>Recyclez vos déchets et suivez en direct l'état de remplissage de vos containers grâce au site Smart
                Containers.</p>

        </section>
        <!-- section signin dans votre site qui correspond à la section en vert  -->
        <section class="signin">

            <h2>Connectez-vous à votre espace</h2>
            <div class="form-group1">
                <img src="logo_user.png" alt="logo_user" class="user_logo">
                <input id="nom_utilisateur" class="form-control" name="Nom d'utilisateur"
                    placeholder="Nom d'utilisateur">
                    <span id="error_input_user" class="error_user"></span>
            </div>
            <div class="form-group2">
                <img src="password.png" alt="password" class="password_logo">
                <input id="password" type="password" class="form-control" name="Passwordr" placeholder="Mot de passe">
                <span id="error_input_password" class="error_password"></span>
            
                
            </div>
            <div class="form-group3">
                <div class="text_oublié">
                <p><a href="Email.html"> Mot de passe oublié ?</a></p>
                
            </div>
                <button class="btn" type="button" onclick="verifierFormulaire()" >Se connecter</button>
            </div>
            

        </section>
    </div>

</body>

</html>
